<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OT Medición · Almacén B</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;min-height:100vh;font-size:14px;touch-action:pan-x pan-y pinch-zoom;color:#1a1a2e}
.hdr{background:#1a1a2e;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
.hdr-t{font-size:15px;font-weight:700}
.hdr-sub{font-size:10px;color:#8888aa;margin-top:1px}
.hdr-back{background:none;border:none;color:#fff;font-size:20px;padding:4px 8px;cursor:pointer}
.wrap{padding:12px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;margin-bottom:10px}
.sec-lbl{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}

/* --- Pantalla selección bloque --- */
.op-select{padding:14px 12px}
.op-row{display:flex;gap:8px;margin-bottom:10px}
.op-row input{flex:1;padding:11px 14px;font-size:15px;border:1.5px solid #ddd;border-radius:8px;background:#fff;color:#1a1a2e;outline:none}
.op-row input:focus{border-color:#e94560}
.bloque-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.bloque-btn{background:#fff;border:1.5px solid #ddd;border-radius:10px;padding:14px 6px;text-align:center;cursor:pointer;position:relative}
.bloque-btn .bn{font-size:20px;font-weight:800;color:#0f3460}
.bloque-btn .bl{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.bloque-btn .bp{font-size:10px;font-weight:700;margin-top:5px;padding:2px 6px;border-radius:10px;display:inline-block}
.bloque-btn.done{border-color:#27ae60;background:#f0fff4}
.bloque-btn.partial{border-color:#f39c12}

/* --- Progreso --- */
.progress-wrap{background:#fff;border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.progress-num{font-size:18px;font-weight:800;color:#1a1a2e}
.progress-lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.04em}
.pbar-bg{height:7px;border-radius:4px;background:#f0f0f0;overflow:hidden}
.pbar-fill{height:7px;border-radius:4px;background:#27ae60;transition:width .2s}

/* --- Lista ubicaciones --- */
.ub-item{border-bottom:1px solid #f0f0f0;padding:12px}
.ub-item:last-child{border-bottom:none}
.ub-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ub-cod{font-size:16px;font-weight:800;color:#0f3460;letter-spacing:.03em}
.ub-meta{font-size:10px;color:#aaa;margin-top:2px}
.ub-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap}
.st-pend{background:#f0f0f0;color:#888}
.st-ok{background:#f0fff4;color:#27ae60}
.st-no{background:#fff0f0;color:#c0392b}
.ub-fields{display:flex;gap:8px;margin-bottom:8px}
.fld{flex:1}
.fld-lbl{font-size:9px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;display:flex;justify-content:space-between}
.fld-ref{color:#bbb;font-weight:600;text-transform:none;letter-spacing:0}
.fld input{width:100%;padding:9px 10px;font-size:15px;border:1.5px solid #ddd;border-radius:7px;background:#fff;color:#1a1a2e;outline:none}
.fld input:focus{border-color:#e94560}
.fld input.filled{border-color:#27ae60;background:#f8fff8}
.ub-actions{display:flex;gap:8px}
.btn-conf{flex:1;border:none;background:#e8f8ee;color:#27ae60;font-size:12px;font-weight:700;padding:9px 8px;border-radius:7px;cursor:pointer}
.btn-conf.on{background:#27ae60;color:#fff}
.btn-no{flex:1;border:none;background:#fff0f0;color:#c0392b;font-size:12px;font-weight:700;padding:9px 8px;border-radius:7px;cursor:pointer}
.btn-no.on{background:#c0392b;color:#fff}
.coment{font-size:10px;color:#e67e22;margin-top:6px;background:#fff8f0;padding:4px 8px;border-radius:5px}

.footer-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e0e0e0;padding:10px 12px;display:flex;gap:8px;z-index:40}
.btn-export{flex:1;border:none;background:#1a1a2e;color:#fff;font-size:13px;font-weight:700;padding:12px 8px;border-radius:8px;cursor:pointer}
.btn-inc{background:#fff0f0;color:#c0392b;border:1.5px solid #f5c6c6;font-size:12px;font-weight:700;padding:12px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;font-size:13px;font-weight:600;padding:10px 20px;border-radius:20px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}

.empty{text-align:center;padding:30px;color:#aaa;font-size:13px}

.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;border-radius:14px 14px 0 0;padding:18px 16px 28px;width:100%;max-width:520px;max-height:80vh;overflow-y:auto}
.sheet-title{font-size:13px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.inc-item{padding:9px 0;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
.inc-cod{font-weight:700;color:#c0392b}
.inc-btn{border:none;background:#f0f0f0;color:#666;font-size:10px;font-weight:700;padding:6px 10px;border-radius:6px}
.sheet-close{width:100%;margin-top:14px;padding:11px;border:none;background:#f0f0f0;color:#666;font-weight:700;border-radius:8px}
</style>
</head>

</div>

<div class="wrap" id="app"></div>

loque": "13", "columna": "05", "nivel": "0", "cod": "B13050", "alto": "", "fondo": "120", "coment": ""}, {"bloque": "13", "columna": "05", "nivel": "1", "cod": "B13051", "alto": "", "fondo": "120", "coment": ""}, {"bloque": "13", "columna": "05", "nivel": "2", "cod": "B13052", "alto": "", "fondo": "120", "coment": ""}, {"bloque": "13", "columna": "06", "nivel": "0", "cod": "B13060", "alto": "", "fondo": "120", "coment": ""}, {"bloque": "13", "columna": "06", "nivel": "1", "cod": "B13061", "alto": "", "fondo": "120", "coment": ""}, {"bloque": "13", "columna": "06", "nivel": "2", "cod": "B13062", "alto": "", "fondo": "120", "coment": ""}, {"bloque": "13", "columna": "07", "nivel": "0", "cod": "B13070", "alto": "", "fondo": "120", "coment": ""}, {"bloque": "13", "columna": "07", "nivel": "1", "cod": "B13071", "alto": "", "fondo": "120", "coment": ""}, {"bloque": "13", "columna": "07", "nivel": "2", "cod": "B13072", "alto": "", "fondo": "120", "coment": ""}, {"bloque": "13", "columna": "08", "nivel": "0", "cod": "B13080", "alto": "", "fondo": "120", "coment": ""}, {"bloque": "13", "columna": "08", "nivel": "1", "cod": "B13081", "alto": "", "fondo": "120", "coment": ""}, {"bloque": "13", "columna": "08", "nivel": "2", "cod": "B13082", "alto": "", "fondo": "120", "coment": ""}];
</script>
<script>
const LS_KEY = 'ot_medicion_b_v1';

function loadState(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; }
}
function saveState(s){
  localStorage.setItem(LS_KEY, JSON.stringify(s));
}
let STATE = loadState(); // { [cod]: { alto, fondo, confirmada, noExiste } }

let currentBloque = null;

const BLOQUES = [...new Set(UB_DATA.map(d=>d.bloque))].sort();

function bloqueStats(bloque){
  const items = UB_DATA.filter(d=>d.bloque===bloque);
  let done = 0;
  items.forEach(d=>{
    const s = STATE[d.cod];
    if(s && (s.confirmada || s.noExiste)) done++;
  });
  return {total: items.length, done};
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>{ t.style.opacity='0'; }, 1800);
}

function render(){
  const app = document.getElementById('app');
  const backBtn = document.getElementById('backBtn');
  const incBtn = document.getElementById('incBtn');
  const hdrTitle = document.getElementById('hdrTitle');
  const hdrSub = document.getElementById('hdrSub');

  if(!currentBloque){
    backBtn.style.display = 'none';
    incBtn.style.display = 'inline-block';
    hdrTitle.textContent = 'OT Medición · Almacén B';
    hdrSub.textContent = 'Selecciona tu pasillo/bloque asignado';
    renderBloqueSelect(app);
  }else{
    backBtn.style.display = 'inline-block';
    incBtn.style.display = 'inline-block';
    hdrTitle.textContent = 'Bloque ' + currentBloque;
    const st = bloqueStats(currentBloque);
    hdrSub.textContent = st.done + ' / ' + st.total + ' ubicaciones';
    renderBloqueDetail(app, currentBloque);
  }
  renderIncList();
}

function renderBloqueSelect(app){
  let html = '<div class="op-select">';
  html += '<div class="sec-lbl">Bloques del Almacén B</div>';
  html += '<div class="bloque-grid">';
  BLOQUES.forEach(b=>{
    const st = bloqueStats(b);
    const cls = st.done===0 ? '' : (st.done===st.total ? 'done' : 'partial');
    html += `<div class="bloque-btn ${cls}" onclick="openBloque('${b}')">
      <div class="bn">B${b}</div>
      <div class="bl">bloque</div>
      <div class="bp" style="background:${st.done===st.total?'#e8f8ee':st.done===0?'#f0f0f0':'#fff6e6'};color:${st.done===st.total?'#27ae60':st.done===0?'#888':'#e67e22'}">${st.done}/${st.total}</div>
    </div>`;
  });
  html += '</div></div>';
  app.innerHTML = html;
}

function openBloque(b){
  currentBloque = b;
  render();
}
function goBack(){
  currentBloque = null;
  render();
}

function renderBloqueDetail(app, bloque){
  const items = UB_DATA.filter(d=>d.bloque===bloque)
    .sort((a,b)=> (a.columna+a.nivel).localeCompare(b.columna+b.nivel));
  const st = bloqueStats(bloque);

  let html = '<div class="progress-wrap">';
  html += `<div class="progress-top"><div class="progress-num">${st.done} / ${st.total}</div><div class="progress-lbl">medidas</div></div>`;
  html += `<div class="pbar-bg"><div class="pbar-fill" style="width:${st.total?(st.done/st.total*100):0}%"></div></div>`;
  html += '</div>';

  html += '<div class="card">';
  if(items.length===0){
    html += '<div class="empty">Sin ubicaciones en este bloque</div>';
  }else{
    items.forEach(d=>{
      const s = STATE[d.cod] || {};
      let statusHtml = '<span class="ub-status st-pend">Pendiente</span>';
      if(s.confirmada) statusHtml = '<span class="ub-status st-ok">✓ Confirmada</span>';
      else if(s.noExiste) statusHtml = '<span class="ub-status st-no">✕ No existe</span>';

      html += `<div class="ub-item">
        <div class="ub-top">
          <div>
            <div class="ub-cod">${d.cod}</div>
            <div class="ub-meta">Col ${d.columna} · Nivel ${d.nivel}</div>
          </div>
          ${statusHtml}
        </div>
        <div class="ub-fields">
          <div class="fld">
            <div class="fld-lbl"><span>Alto (cm)</span><span class="fld-ref">${d.alto? 'ref: '+d.alto : ''}</span></div>
            <input type="number" inputmode="decimal" placeholder="${d.alto || '—'}" value="${s.alto||''}" class="${s.alto?'filled':''}" onchange="setField('${d.cod}','alto',this.value)" ${s.noExiste?'disabled':''}>
          </div>
          <div class="fld">
            <div class="fld-lbl"><span>Fondo (cm)</span><span class="fld-ref">${d.fondo? 'ref: '+d.fondo : ''}</span></div>
            <input type="number" inputmode="decimal" placeholder="${d.fondo || '—'}" value="${s.fondo||''}" class="${s.fondo?'filled':''}" onchange="setField('${d.cod}','fondo',this.value)" ${s.noExiste?'disabled':''}>
          </div>
        </div>
        ${d.coment ? `<div class="coment">ℹ ${d.coment.trim()}</div>` : ''}
        <div class="ub-actions">
          <button class="btn-conf ${s.confirmada?'on':''}" onclick="toggleConfirmada('${d.cod}')">✓ Confirmar</button>
          <button class="btn-no ${s.noExiste?'on':''}" onclick="toggleNoExiste('${d.cod}')">✕ No existe</button>
        </div>
      </div>`;
    });
  }
  html += '</div>';

  app.innerHTML = html;

  // footer export bar
  const footer = document.createElement('div');
  footer.className = 'footer-bar';
  footer.innerHTML = `<button class="btn-inc" onclick="showInc()">⚠ Incidencias</button><button class="btn-export" onclick="exportExcel()">⬇ Exportar a Excel</button>`;
  app.appendChild(footer);
}

function setField(cod, field, val){
  if(!STATE[cod]) STATE[cod] = {};
  STATE[cod][field] = val;
  saveState(STATE);
  render();
}
function toggleConfirmada(cod){
  if(!STATE[cod]) STATE[cod] = {};
  const s = STATE[cod];
  if(!s.alto && !s.fondo && !s.confirmada){
    showToast('Introduce al menos una medida antes de confirmar');
    return;
  }
  s.confirmada = !s.confirmada;
  if(s.confirmada) s.noExiste = false;
  saveState(STATE);
  showToast(s.confirmada ? 'Ubicación confirmada' : 'Confirmación quitada');
  render();
}
function toggleNoExiste(cod){
  if(!STATE[cod]) STATE[cod] = {};
  const s = STATE[cod];
  s.noExiste = !s.noExiste;
  if(s.noExiste) s.confirmada = false;
  saveState(STATE);
  showToast(s.noExiste ? 'Marcada como incidencia' : 'Incidencia quitada');
  render();
}

function renderIncList(){
  const list = document.getElementById('incList');
  const incs = Object.entries(STATE).filter(([cod,s])=>s.noExiste);
  if(incs.length===0){
    list.innerHTML = '<div class="empty">Sin incidencias registradas</div>';
    return;
  }
  list.innerHTML = incs.map(([cod,s])=>`
    <div class="inc-item">
      <div><div class="inc-cod">${cod}</div></div>
      <button class="inc-btn" onclick="toggleNoExiste('${cod}');closeInc();showInc();">Quitar</button>
    </div>
  `).join('');
}
function showInc(){
  renderIncList();
  document.getElementById('incOverlay').classList.add('show');
}
function closeInc(){
  document.getElementById('incOverlay').classList.remove('show');
}

function exportExcel(){
  // Genera CSV compatible Excel con mismo formato de columnas que MAPA_DE_ALMACEN_ZONA_B.xlsx
  let rows = [['Almacén','Planta','Zona','Bloque','Columna','Nivel','Ubicación','Alto ub. (cm)','Fondo ub. (cm)','Comentario','Estado medición','Alto medido (cm)','Fondo medido (cm)']];
  UB_DATA.forEach(d=>{
    const s = STATE[d.cod] || {};
    let estado = 'Pendiente';
    if(s.confirmada) estado = 'Confirmada';
    else if(s.noExiste) estado = 'No existe';
    rows.push([
      '1','0','B', d.bloque, d.columna, d.nivel,
      d.bloque+' '+d.columna+' '+d.nivel,
      d.alto, d.fondo, d.coment,
      estado, s.alto||'', s.fondo||''
    ]);
  });
  const csv = rows.map(r=>r.map(v=>{
    v = String(v==null?'':v);
    if(v.includes(';')||v.includes('"')||v.includes('\n')) v = '"'+v.replace(/"/g,'""')+'"';
    return v;
  }).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mediciones_almacen_b_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Exportado ✓');
}

document.getElementById('backBtn').addEventListener('click', goBack);
document.getElementById('incBtn').addEventListener('click', showInc);

render();
</script>
